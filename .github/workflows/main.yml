name: Build HeroBot
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HerobaneNair/HeRoBot
          ref: 26.2
      - name: Make mixin failures non-fatal
        run: |
          sed -i 's/"defaultRequire": 1/"defaultRequire": 0/' herobot-mod/src/main/resources/*.json herobot-mod/src/client/resources/*.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew
      - run: ./gradlew :herobot-mod:shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: herobot-fabric
          path: |
            herobot-mod/build/libs/*.jar
            !herobot-mod/build/libs/*-sources.jar
